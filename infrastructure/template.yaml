AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CareCue - Privacy-First Healthcare Information Companion
  AWS Serverless Infrastructure ($0 Idle Cost Architecture)

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage environment.

  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Amazon Bedrock Foundation Model ID used for clinical document comprehension.

  GeminiSecretName:
    Type: String
    Default: carecue/dev/gemini
    Description: Name of the existing AWS Secrets Manager secret containing GEMINI_API_KEY.

  SmtpHost:
    Type: String
    Default: smtp.gmail.com
    Description: SMTP server host for sending OTP emails.

  SmtpPort:
    Type: String
    Default: "587"
    Description: SMTP server port.

  SmtpUsername:
    Type: String
    Default: ""
    Description: SMTP username/email address.

  SmtpPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: SMTP application password.

  SmtpUseTls:
    Type: String
    Default: "true"
    Description: Use TLS for SMTP connection.

  AppUrl:
    Type: String
    Default: https://production.d1hi4xdmbv4m4r.amplifyapp.com
    Description: Production Web App URL.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Tracing: Disabled
    Environment:
      Variables:
        ENV: !Ref Environment
        SESSIONS_TABLE_NAME: !Ref CareCueSessionsTable
        DOCUMENTS_BUCKET_NAME: !Ref CareCueDocumentsBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        GEMINI_SECRET_NAME: !Ref GeminiSecretName
        SMTP_HOST: !Ref SmtpHost
        SMTP_PORT: !Ref SmtpPort
        SMTP_USERNAME: !Ref SmtpUsername
        SMTP_PASSWORD: !Ref SmtpPassword
        SMTP_USE_TLS: !Ref SmtpUseTls
        APP_URL: !Ref AppUrl
        DB_PATH: /tmp/carecue.db
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:
  ##############################################################################
  # 1. S3 Storage - Ephemeral Documents ($0 Idle Cost + 7-Day Auto-Expiration)
  ##############################################################################
  CareCueDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "carecue-documents-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUserDocumentsAfter7Days
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
              - DELETE
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  ##############################################################################
  # 2. DynamoDB Storage - Sessions & Metadata (PAY_PER_REQUEST, $0 Idle Cost)
  ##############################################################################
  CareCueSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "carecue-sessions-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  ##############################################################################
  # 3. HTTP API Gateway (Low Cost, High Performance)
  ##############################################################################
  CareCueHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - '*'
        MaxAge: 600

  ##############################################################################
  # 4. Lambda Functions
  ##############################################################################

  # Authentication, OTP, Demo & Health
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.auth_handler.lambda_handler
      MemorySize: 512
      Timeout: 20
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
      Events:
        AuthSignup:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/signup
            Method: POST
        AuthVerifyOtp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/verify-otp
            Method: POST
        AuthVerifyEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/verify-email
            Method: POST
        AuthResendOtp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/resend-otp
            Method: POST
        AuthSignin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/signin
            Method: POST
        AuthLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/login
            Method: POST
        AuthDemoSignin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/demo-signin
            Method: POST
        AuthForgotPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/forgot-password
            Method: POST
        AuthResetPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /auth/reset-password
            Method: POST
        DemoLoad:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /demo/load
            Method: POST
        DemoClear:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /demo/clear
            Method: POST
        HealthAi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /health/ai
            Method: GET
        HealthAiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /health/ai
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /health
            Method: GET

  # Patient Manager & Timeline
  PatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.patient_handler.lambda_handler
      MemorySize: 512
      Timeout: 20
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
      Events:
        ListPatients:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients
            Method: GET
        CreatePatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients
            Method: POST
        GetPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}
            Method: GET
        PatchPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}
            Method: PATCH
        PutPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}
            Method: PUT
        DeletePatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}
            Method: DELETE
        GetPatientDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/documents
            Method: GET
        AddPatientDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/documents
            Method: POST
        DeletePatientDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/documents/{docId}
            Method: DELETE
        AttachPatientDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/attach-document
            Method: POST
        CreatePatientFromDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/from-document
            Method: POST
        GetPatientTimeline:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/timeline
            Method: GET
        GetPatientFindings:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/findings
            Method: GET
        GetPatientMedications:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/medications
            Method: GET
        AddPatientMedication:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/medications
            Method: POST
        GetPatientDoctorBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/doctor-brief
            Method: GET
        SavePatientDoctorBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/doctor-brief
            Method: POST
        GetPatientEmergencyProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/emergency-profile
            Method: GET
        UpdatePatientEmergencyProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /patients/{id}/emergency-profile
            Method: PUT
        IdentifyPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/identify-patient
            Method: POST
        MatchPatient:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/match-patient
            Method: POST

  # Document Upload, S3 Presigned URL & Extraction Pipeline
  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.upload_handler.lambda_handler
      MemorySize: 1024
      Timeout: 60
      Policies:
        - S3WritePolicy:
            BucketName: !Ref CareCueDocumentsBucket
        - S3ReadPolicy:
            BucketName: !Ref CareCueDocumentsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
      Events:
        UploadDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/upload
            Method: POST
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/upload-url
            Method: POST
        GetDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/{id}
            Method: GET
        GetDocumentText:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/{id}/text
            Method: GET
        RetryAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /documents/{id}/retry-analysis
            Method: POST

  # Session Manager (CRUD sessions)
  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.session_handler.lambda_handler
      MemorySize: 256
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
      Events:
        CreateSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /sessions
            Method: POST
        ListSessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /sessions
            Method: GET
        GetSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /sessions/{sessionId}
            Method: GET
        DeleteSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /sessions/{sessionId}
            Method: DELETE

  # Document Process & Bedrock Analysis
  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.process_handler.lambda_handler
      MemorySize: 1024
      Timeout: 60
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CareCueDocumentsBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"
      Events:
        StartAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /analysis
            Method: POST
        GetAnalysis:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /analysis/{sessionId}
            Method: GET

  # Dual-AI Consensus Verification (Bedrock + Gemini Cross-Check)
  VerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.verification_handler.lambda_handler
      MemorySize: 512
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GeminiSecretName}*"
      Events:
        RunVerification:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /verification
            Method: POST

  # Doctor Brief Compiler
  BriefFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.brief_handler.lambda_handler
      MemorySize: 512
      Timeout: 20
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CareCueSessionsTable
      Events:
        CompileBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /doctor-brief
            Method: POST
        GetBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /doctor-brief/{sessionId}
            Method: GET

  # Conversational Health Literacy Guidance
  GuidanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.guidance_handler.lambda_handler
      MemorySize: 512
      Timeout: 25
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CareCueSessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:*::foundation-model/${BedrockModelId}"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-micro-v1:0"
      Events:
        AskGuidance:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /guidance
            Method: POST

  # Multilingual Translation
  TranslationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.translation_handler.lambda_handler
      MemorySize: 512
      Timeout: 25
      Events:
        TranslateText:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /translate
            Method: POST
        TranslateBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /translate-brief
            Method: POST
        TranslateBatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /translate-batch
            Method: POST
        TranslateLegacy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /translation
            Method: POST

  # Plain Language Explanation
  ExplainFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.explain_handler.lambda_handler
      MemorySize: 512
      Timeout: 20
      Events:
        ExplainFinding:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /explain
            Method: POST

  # Emergency Triage Evaluation
  EmergencyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: handlers.emergency_handler.lambda_handler
      MemorySize: 512
      Timeout: 20
      Events:
        EmergencyTriage:
          Type: HttpApi
          Properties:
            ApiId: !Ref CareCueHttpApi
            Path: /emergency
            Method: POST

Outputs:
  HttpApiUrl:
    Description: Base URL for CareCue HTTP API
    Value: !Sub "https://${CareCueHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-HttpApiUrl"

  DocumentsBucketName:
    Description: S3 Bucket for ephemeral uploaded medical documents
    Value: !Ref CareCueDocumentsBucket

  SessionsTableName:
    Description: DynamoDB Table for CareCue user sessions
    Value: !Ref CareCueSessionsTable
